name: Cloudflare Build

# Validates the Cloudflare Workers build path on every PR targeting main
# and on direct pushes to the feature branch. Does NOT deploy.
#
# CI-01 fix (Agent 1 coordinator, Task ID: FIX-CI-01).
# Previously NO workflow exercised `scripts/build-cloudflare.sh` +
# `opennextjs-cloudflare build`, so the entire deliverable of PR #3
# (feature/cloudflare-d1-validation) was unvalidated by CI. This workflow
# closes that gap.
on:
  pull_request:
    branches:
      - main
      - 'fix/**'
      - 'feat/**'
    paths:
      - 'scripts/build-cloudflare.sh'
      - 'scripts/cf-pages-fix.sh'
      - 'next.config.worker.ts'
      - 'next.config.ts'
      - 'open-next.config.ts'
      - 'wrangler.toml'
      - 'src/lib/db.worker.ts'
      - 'src/lib/db-worker.ts'
      - 'src/lib/db-access.ts'
      - 'workers/wallet-release/**'
      - 'wrangler.wallet-release.toml'
      - 'docs/WALLET_ESCROW_SCHEDULED_WORKER.md'
      - '.dockerignore'
      - 'tests/unit/wallet-escrow-scheduled-worker.test.ts'
      - 'tests/unit/wallet-release-atomicity.test.ts'
      - 'tests/integration/wallet-release-postgres.test.ts'
      - 'tests/integration/wallet-release-d1-sqlite.test.ts'
      - 'tests/integration/wallet-release-worker-cursor.test.ts'
      - 'tests/types/node-sqlite.d.ts'
      - 'scripts/wallet-release-staging-fixture.sh'
      - 'scripts/wallet-release-staging-*.sql'
      - 'src/**'
      - 'tests/integration/idempotent-create-flows-d1-sqlite.test.ts'
      - 'tests/integration/care-booking-d1-sqlite.test.ts'
      - 'tests/integration/care-booking-postgres.test.ts'
      - 'prisma/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/cloudflare-build.yml'
  push:
    branches:
      - main
      - 'feature/cloudflare-d1-validation'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cf-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cloudflare-build:
    name: OpenNext → Cloudflare Worker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun (pinned)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'   # pin for reproducibility (addresses CI-03)
          cache: true             # cache bun store keyed on bun.lock

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply full Prisma SQLite migration history to local D1
        run: |
          bash -n scripts/wallet-release-staging-fixture.sh
          printf 'y\n' | bunx wrangler d1 migrations apply mekanix-wallet-escrow-staging \
            --local --config wrangler.wallet-release.toml
          INDEX_RESULT="$(bunx wrangler d1 execute mekanix-wallet-escrow-staging --local \
            --config wrangler.wallet-release.toml \
            --command "SELECT name FROM sqlite_schema WHERE type='index' AND name='WalletTransaction_status_holdUntil_id_idx';")"
          echo "$INDEX_RESULT"
          grep -q "WalletTransaction_status_holdUntil_id_idx" <<< "$INDEX_RESULT"
          CURSOR_RESULT="$(bunx wrangler d1 execute mekanix-wallet-escrow-staging --local \
            --config wrangler.wallet-release.toml \
            --command "SELECT name FROM sqlite_schema WHERE type='table' AND name='WalletReleaseWorkerState';")"
          echo "$CURSOR_RESULT"
          grep -q "WalletReleaseWorkerState" <<< "$CURSOR_RESULT"
          bunx wrangler d1 execute mekanix-wallet-escrow-staging --local --yes \
            --config wrangler.wallet-release.toml --file scripts/wallet-release-staging-seed.sql
          SEED_RESULT="$(bunx wrangler d1 execute mekanix-wallet-escrow-staging --local \
            --config wrangler.wallet-release.toml \
            --command "SELECT status FROM WalletTransaction WHERE id='wallet-release-staging-txn';")"
          echo "$SEED_RESULT"
          grep -q "PENDING" <<< "$SEED_RESULT"
          bunx wrangler d1 execute mekanix-wallet-escrow-staging --local --yes \
            --config wrangler.wallet-release.toml --file scripts/wallet-release-staging-cleanup.sql
          echo "✅ Nested Prisma migrations, worker schema, and staging fixture SQL verified in local D1"

      - name: Build Cloudflare Worker
        env:
          DATABASE_URL: 'file:./db/custom.db'
        run: bash scripts/build-cloudflare.sh
        # build-cloudflare.sh handles: schema engineType swap, next.config.worker swap,
        # db.worker.ts swap, prisma generate, OpenNext build, and trap-based restore.

      - name: Verify Worker artifact
        run: |
          test -f .open-next/worker.js         || { echo 'worker.js missing'; exit 1; }
          test -d .open-next/assets             || { echo 'assets dir missing'; exit 1; }
          test -f .open-next/server-functions/default/handler.mjs || { echo 'handler.mjs missing'; exit 1; }
          echo "Worker artifact size: $(du -sh .open-next/worker.js | cut -f1)"

      - name: Assert no untracked source mutation leaked
        run: |
          # build-cloudflare.sh restores schema/next.config/db.ts via trap.
          # Fail if any backup file survived.
          ! [ -f prisma/schema.prisma.bak ] || { echo 'schema backup leaked'; exit 1; }
          ! [ -f next.config.ts.bak ]       || { echo 'next.config backup leaked'; exit 1; }
          ! [ -f src/lib/db.ts.bak ]        || { echo 'db.ts backup leaked'; exit 1; }

      - name: Upload Worker artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: opennext-worker-${{ github.sha }}
          path: |
            .open-next/worker.js
            .open-next/server-functions/default/handler.mjs
            .open-next/assets
          if-no-files-found: warn
          retention-days: 7
