name: Docker E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "fix/**", "feat/**"]

permissions:
  contents: read

jobs:
  docker-deploy-test:
    name: Docker Build + Compose + Health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PASSWORD: test_password
      JWT_SECRET: mekanix-ci-jwt-secret-with-at-least-32-bytes-2026
      MEKANIX_PRICING_IRR_APPROVED: "true"
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Prepare build context with PostgreSQL migrations
        run: |
          mkdir -p /tmp/mekanix-build
          rsync -a --exclude='node_modules' --exclude='.next' --exclude='.git' \
            --exclude='db/*.db' --exclude='*.log' \
            ./ /tmp/mekanix-build/
          
          rm -rf /tmp/mekanix-build/prisma/migrations
          # Use the complete PostgreSQL migration history, not just init.
          cp -a prisma/migrations-postgresql /tmp/mekanix-build/prisma/migrations
          
          # Guard against silently omitting additive migrations from Docker E2E.
          test -f /tmp/mekanix-build/prisma/migrations/20260925000000_init/migration.sql
          test -f /tmp/mekanix-build/prisma/migrations/20260926000000_add_rate_limit_idempotency/migration.sql
          test -f /tmp/mekanix-build/prisma/migrations/20260927000000_vip_paymentid_unique/migration.sql
          test -f /tmp/mekanix-build/prisma/migrations/20261101000000_care_booking_idempotency/migration.sql
          test -f /tmp/mekanix-build/prisma/migrations/20261101010000_request_claim_idempotency/migration.sql
          test -f /tmp/mekanix-build/prisma/migrations/migration_lock.toml
          
          sed -i 's/provider = "sqlite"/provider = "postgresql"/' \
            /tmp/mekanix-build/prisma/schema.prisma
          
          echo "✅ Build context prepared with all PostgreSQL migrations"
          find /tmp/mekanix-build/prisma/migrations -maxdepth 2 -type f -print
      
      - name: Validate staging compose and operational shell scripts
        run: |
          bash -n scripts/lib/pg-service.sh scripts/backup-db.sh scripts/restore-db.sh scripts/test-backup-restore.sh scripts/deploy-staging.sh scripts/zap-scan.sh tests/scripts/zap-scan.test.sh
          bash tests/scripts/zap-scan.test.sh
          DB_PASSWORD=test_password JWT_SECRET=test_jwt_secret REDIS_PASSWORD=test_redis_password \
            docker compose -f docker-compose.staging.yml config --quiet
          echo "✅ Staging Compose and operational shell scripts are syntactically valid"

      - name: Build and start Docker Compose stack
        run: |
          cd /tmp/mekanix-build
          docker compose up -d --build
          docker compose ps
      
      - name: Wait for health check
        run: |
          echo "Waiting for app to be healthy..."
          for i in $(seq 1 90); do
            HEALTH=$(curl -s http://localhost:3000/api/health 2>/dev/null || echo '{}')
            if echo "$HEALTH" | grep -q '"ok":true'; then
              echo "✅ App is healthy!"
              echo "$HEALTH" | python3 -m json.tool
              exit 0
            fi
            # Check if app container is running
            if ! docker compose -f /tmp/mekanix-build/docker-compose.yml ps app | grep -q "Up\|running"; then
              echo "❌ App container not running!"
              echo "=== App logs ==="
              docker compose -f /tmp/mekanix-build/docker-compose.yml logs app
              echo "=== Migrate logs ==="
              docker compose -f /tmp/mekanix-build/docker-compose.yml logs migrate
              exit 1
            fi
            echo "  Waiting... ($i/90)"
            sleep 2
          done
          echo "❌ App did not become healthy"
          docker compose -f /tmp/mekanix-build/docker-compose.yml logs
          exit 1
      
      - name: Verify database is PostgreSQL
        run: |
          HEALTH=$(curl -s http://localhost:3000/api/health)
          echo "$HEALTH" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          db_status = d['services']['database']
          assert db_status == 'healthy', f'Database not healthy: {db_status}'
          print(f'✅ Database: {db_status}')
          "
          
          # Verify additive migration objects exist; health alone cannot prove schema parity.
          REQUIRED_OBJECTS=$(docker compose -f /tmp/mekanix-build/docker-compose.yml exec -T db \
            psql -U mekanix -d mekanix -Atc "SELECT COUNT(*) FROM pg_class WHERE relname IN ('RateLimit','IdempotencyKey','UserVipSubscription_paymentId_key','UserVipSubscription_one_active_per_user_key','ServiceBooking_idempotencyKey_key','ServiceTimelineEvent_idempotencyKey_key','ServiceRequest_idempotencyKey_key','InsuranceClaim_idempotencyKey_key');")
          if [ "$REQUIRED_OBJECTS" != "8" ]; then
            echo "❌ Expected all additive migration tables/indexes; found $REQUIRED_OBJECTS of 8"
            exit 1
          fi
          FINGERPRINT_COLUMNS=$(docker compose -f /tmp/mekanix-build/docker-compose.yml exec -T db \
            psql -U mekanix -d mekanix -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public' AND column_name='requestFingerprint' AND table_name IN ('ServiceBooking','ServiceRequest','InsuranceClaim');")
          if [ "$FINGERPRINT_COLUMNS" != "3" ]; then
            echo "❌ Expected all three request fingerprint columns; found $FINGERPRINT_COLUMNS of 3"
            exit 1
          fi
          echo "✅ Wallet, VIP, CARE, service-request, and insurance-claim migration objects exist"
      
      - name: Verify production OTP fails closed without a real SMS provider
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/otp-response.json -w "%{http_code}" \
            -X POST http://localhost:3000/api/auth/otp/send \
            -H "Content-Type: application/json" \
            -d '{"phone":"+989121234567"}')
          echo "OTP send HTTP status: $HTTP_STATUS"
          cat /tmp/otp-response.json
          test "$HTTP_STATUS" = "503"
          python3 -c "
          import json
          with open('/tmp/otp-response.json') as f:
              d = json.load(f)
          assert d.get('ok') is not True, f'Unexpected OTP success: {d}'
          assert 'code' not in d, 'Plaintext OTP must never be returned in production'
          "
          OTP_ROWS=$(docker compose -f /tmp/mekanix-build/docker-compose.yml exec -T db \
            psql -U mekanix -d mekanix -Atc 'SELECT COUNT(*) FROM "OtpCode";')
          test "$OTP_ROWS" = "0"
          echo "✅ Production rejects console SMS and persists no OTP when no live provider is configured"

      - name: Install Bun and browser test dependencies
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install project dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: bunx playwright install --with-deps chromium

      - name: Run browser E2E against the live Docker stack
        run: bun run test:e2e
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: http://localhost:3000

      - name: Run real HTTP business flow against isolated PostgreSQL
        run: bun run scripts/e2e/business-http-flow.mjs
        env:
          BASE_URL: http://localhost:3000
          JWT_SECRET: ${{ env.JWT_SECRET }}

      - name: Run k6 smoke load against isolated Docker stack
        run: |
          mkdir -p k6-reports
          docker run --rm --network host --user 0:0 \
            -e BASE_URL=http://127.0.0.1:3000 \
            -e K6_SMOKE=true \
            -v "$PWD/k6-reports:/out" \
            -v "$PWD/scripts/load-test.js:/work/load-test.js:ro" \
            -w /work grafana/k6:latest run \
            --summary-export=/out/k6-summary.json \
            load-test.js
          test -s k6-reports/k6-summary.json
          python3 scripts/validate-k6-summary.py k6-reports/k6-summary.json

      - name: Run full 10/50/100 VU load profile for release candidate
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 191
        run: |
          set -euo pipefail
          mkdir -p k6-reports
          (
            while true; do
              echo "=== $(date -u +%FT%TZ) ==="
              docker stats --no-stream --format '{{.Name}},CPU={{.CPUPerc}},MEM={{.MemUsage}},MEM_PCT={{.MemPerc}},NET={{.NetIO}}' || true
              docker compose -f /tmp/mekanix-build/docker-compose.yml exec -T db \
                psql -U mekanix -d mekanix -Atc \
                "SELECT 'pg_connections=' || count(*) || ',pg_active=' || count(*) FILTER (WHERE state='active') || ',pg_waiting=' || count(*) FILTER (WHERE wait_event IS NOT NULL) FROM pg_stat_activity WHERE datname=current_database();" || true
              sleep 5
            done
          ) > k6-reports/resource-samples.log 2>&1 &
          SAMPLER_PID=$!
          cleanup_sampler() { kill "$SAMPLER_PID" 2>/dev/null || true; wait "$SAMPLER_PID" 2>/dev/null || true; }
          trap cleanup_sampler EXIT
          docker run --rm --network host --user 0:0 \
            -e BASE_URL=http://127.0.0.1:3000 \
            -v "$PWD/k6-reports:/out" \
            -v "$PWD/scripts/load-test.js:/work/load-test.js:ro" \
            -w /work grafana/k6:latest run \
            --summary-export=/out/k6-full-load-summary.json \
            load-test.js
          cleanup_sampler
          trap - EXIT
          test -s k6-reports/k6-full-load-summary.json
          python3 scripts/validate-k6-summary.py k6-reports/k6-full-load-summary.json

      - name: Run OWASP ZAP baseline against isolated Docker stack
        if: always()
        run: |
          mkdir -p zap-reports
          ZAP_DOCKER_NETWORK=host REPORT_DIR="$PWD/zap-reports" bash scripts/zap-scan.sh http://127.0.0.1:3000


      - name: Inject PostgreSQL outage and verify fail-closed recovery
        if: always()
        run: |
          docker compose -f /tmp/mekanix-build/docker-compose.yml stop db
          sleep 3
          DOWN_STATUS=$(curl --max-time 5 -s -o /tmp/health-db-down.json -w "%{http_code}" http://localhost:3000/api/health || true)
          test "$DOWN_STATUS" = "503"
          python3 -c "import json; d=json.load(open('/tmp/health-db-down.json')); assert d['ok'] is False and d['services']['database']=='unhealthy'"
          docker compose -f /tmp/mekanix-build/docker-compose.yml start db
          for i in $(seq 1 60); do
            UP_STATUS=$(curl --max-time 5 -s -o /tmp/health-db-up.json -w "%{http_code}" http://localhost:3000/api/health || true)
            if [ "$UP_STATUS" = "200" ]; then
              python3 -c "import json; d=json.load(open('/tmp/health-db-up.json')); assert d['ok'] is True and d['services']['database']=='healthy'"
              echo "PostgreSQL outage was detected fail-closed and service recovered"
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not recover within 120 seconds"
          exit 1

      - name: Upload isolated security and performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mekanix-isolated-security-performance-${{ github.run_id }}
          path: |
            k6-reports/
            zap-reports/
          if-no-files-found: ignore

      - name: Container logs (on failure)
        if: always()
        run: |
          cd /tmp/mekanix-build
          docker compose logs --tail=100 || true
      
      - name: Stop containers
        if: always()
        run: |
          cd /tmp/mekanix-build
          docker compose down -v || true
