name: Docker E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, "fix/**", "feat/**"]

permissions:
  contents: read

jobs:
  docker-deploy-test:
    name: Docker Build + Compose + Health
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DB_PASSWORD: test_password
      JWT_SECRET: test_secret_for_ci
    
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1
      
      - name: Prepare build context with PostgreSQL migrations
        run: |
          mkdir -p /tmp/mekanix-build
          rsync -a --exclude='node_modules' --exclude='.next' --exclude='.git' \
            --exclude='db/*.db' --exclude='*.log' \
            ./ /tmp/mekanix-build/
          
          rm -rf /tmp/mekanix-build/prisma/migrations
          # Use the complete PostgreSQL migration history, not just init.
          cp -a prisma/migrations-postgresql /tmp/mekanix-build/prisma/migrations
          
          # Guard against silently omitting additive migrations from Docker E2E.
          test -f /tmp/mekanix-build/prisma/migrations/20260925000000_init/migration.sql
          test -f /tmp/mekanix-build/prisma/migrations/20260926000000_add_rate_limit_idempotency/migration.sql
          test -f /tmp/mekanix-build/prisma/migrations/20260927000000_vip_paymentid_unique/migration.sql
          test -f /tmp/mekanix-build/prisma/migrations/20261101000000_care_booking_idempotency/migration.sql
          test -f /tmp/mekanix-build/prisma/migrations/20261101010000_request_claim_idempotency/migration.sql
          test -f /tmp/mekanix-build/prisma/migrations/migration_lock.toml
          
          sed -i 's/provider = "sqlite"/provider = "postgresql"/' \
            /tmp/mekanix-build/prisma/schema.prisma
          
          echo "✅ Build context prepared with all PostgreSQL migrations"
          find /tmp/mekanix-build/prisma/migrations -maxdepth 2 -type f -print
      
      - name: Validate staging compose and operational shell scripts
        run: |
          bash -n scripts/lib/pg-service.sh scripts/backup-db.sh scripts/restore-db.sh scripts/test-backup-restore.sh scripts/deploy-staging.sh scripts/zap-scan.sh
          DB_PASSWORD=test_password JWT_SECRET=test_jwt_secret REDIS_PASSWORD=test_redis_password \
            docker compose -f docker-compose.staging.yml config --quiet
          echo "✅ Staging Compose and operational shell scripts are syntactically valid"

      - name: Build and start Docker Compose stack
        run: |
          cd /tmp/mekanix-build
          docker compose up -d --build
          docker compose ps
      
      - name: Wait for health check
        run: |
          echo "Waiting for app to be healthy..."
          for i in $(seq 1 90); do
            HEALTH=$(curl -s http://localhost:3000/api/health 2>/dev/null || echo '{}')
            if echo "$HEALTH" | grep -q '"ok":true'; then
              echo "✅ App is healthy!"
              echo "$HEALTH" | python3 -m json.tool
              exit 0
            fi
            # Check if app container is running
            if ! docker compose -f /tmp/mekanix-build/docker-compose.yml ps app | grep -q "Up\|running"; then
              echo "❌ App container not running!"
              echo "=== App logs ==="
              docker compose -f /tmp/mekanix-build/docker-compose.yml logs app
              echo "=== Migrate logs ==="
              docker compose -f /tmp/mekanix-build/docker-compose.yml logs migrate
              exit 1
            fi
            echo "  Waiting... ($i/90)"
            sleep 2
          done
          echo "❌ App did not become healthy"
          docker compose -f /tmp/mekanix-build/docker-compose.yml logs
          exit 1
      
      - name: Verify database is PostgreSQL
        run: |
          HEALTH=$(curl -s http://localhost:3000/api/health)
          echo "$HEALTH" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          db_status = d['services']['database']
          assert db_status == 'healthy', f'Database not healthy: {db_status}'
          print(f'✅ Database: {db_status}')
          "
          
          # Verify additive migration objects exist; health alone cannot prove schema parity.
          REQUIRED_OBJECTS=$(docker compose -f /tmp/mekanix-build/docker-compose.yml exec -T db \
            psql -U mekanix -d mekanix -Atc "SELECT COUNT(*) FROM pg_class WHERE relname IN ('RateLimit','IdempotencyKey','UserVipSubscription_paymentId_key','UserVipSubscription_one_active_per_user_key','ServiceBooking_idempotencyKey_key','ServiceTimelineEvent_idempotencyKey_key','ServiceRequest_idempotencyKey_key','InsuranceClaim_idempotencyKey_key');")
          if [ "$REQUIRED_OBJECTS" != "8" ]; then
            echo "❌ Expected all additive migration tables/indexes; found $REQUIRED_OBJECTS of 8"
            exit 1
          fi
          FINGERPRINT_COLUMNS=$(docker compose -f /tmp/mekanix-build/docker-compose.yml exec -T db \
            psql -U mekanix -d mekanix -Atc "SELECT COUNT(*) FROM information_schema.columns WHERE table_schema='public' AND column_name='requestFingerprint' AND table_name IN ('ServiceBooking','ServiceRequest','InsuranceClaim');")
          if [ "$FINGERPRINT_COLUMNS" != "3" ]; then
            echo "❌ Expected all three request fingerprint columns; found $FINGERPRINT_COLUMNS of 3"
            exit 1
          fi
          echo "✅ Wallet, VIP, CARE, service-request, and insurance-claim migration objects exist"
      
      - name: Verify production OTP fails closed without a real SMS provider
        run: |
          HTTP_STATUS=$(curl -s -o /tmp/otp-response.json -w "%{http_code}" \
            -X POST http://localhost:3000/api/auth/otp/send \
            -H "Content-Type: application/json" \
            -d '{"phone":"+989121234567"}')
          echo "OTP send HTTP status: $HTTP_STATUS"
          cat /tmp/otp-response.json
          test "$HTTP_STATUS" = "503"
          python3 -c "
          import json
          with open('/tmp/otp-response.json') as f:
              d = json.load(f)
          assert d.get('ok') is not True, f'Unexpected OTP success: {d}'
          assert 'code' not in d, 'Plaintext OTP must never be returned in production'
          "
          OTP_ROWS=$(docker compose -f /tmp/mekanix-build/docker-compose.yml exec -T db \
            psql -U mekanix -d mekanix -Atc 'SELECT COUNT(*) FROM "OtpCode";')
          test "$OTP_ROWS" = "0"
          echo "✅ Production rejects console SMS and persists no OTP when no live provider is configured"

      - name: Container logs (on failure)
        if: always()
        run: |
          cd /tmp/mekanix-build
          docker compose logs --tail=100 || true
      
      - name: Stop containers
        if: always()
        run: |
          cd /tmp/mekanix-build
          docker compose down -v || true
