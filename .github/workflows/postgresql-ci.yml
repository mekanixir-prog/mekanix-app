name: PostgreSQL CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  postgres-test:
    name: PostgreSQL Migration + Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mekanix
          POSTGRES_PASSWORD: mekanix_test
          POSTGRES_DB: mekanix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install dependencies
        run: bun install --frozen-lockfile
      
      - name: Switch schema to PostgreSQL
        run: |
          sed -i 's/provider = "sqlite"/provider = "postgresql"/' prisma/schema.prisma
      
      - name: Replace migrations with PostgreSQL versions
        run: |
          rm -rf prisma/migrations
          mkdir -p prisma/migrations/20260925000000_init
          cp prisma/migrations-postgresql/20260925000000_init/migration.sql prisma/migrations/20260925000000_init/migration.sql
          cp prisma/migrations-postgresql/migration_lock.toml prisma/migrations/migration_lock.toml
          echo "Migrations structure:"
          find prisma/migrations -type f
          echo ""
          echo "Lock file:"
          cat prisma/migrations/migration_lock.toml
      
      - name: Generate Prisma Client
        run: bunx prisma generate
        env:
          DATABASE_URL: postgresql://mekanix:mekanix_test@localhost:5432/mekanix_test
      
      - name: Deploy migrations to PostgreSQL
        run: bunx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://mekanix:mekanix_test@localhost:5432/mekanix_test
      
      - name: Run TypeScript check
        run: bunx tsc --noEmit
        env:
          DATABASE_URL: postgresql://mekanix:mekanix_test@localhost:5432/mekanix_test
      
      - name: Run tests
        run: bun run test
        env:
          DATABASE_URL: postgresql://mekanix:mekanix_test@localhost:5432/mekanix_test
      
      - name: Build
        run: bun run build
        env:
          DATABASE_URL: postgresql://mekanix:mekanix_test@localhost:5432/mekanix_test
