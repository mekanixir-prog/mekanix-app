name: Production readiness

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "hardening/**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prisma generate
      - name: Repository hygiene
        run: bash scripts/check-hygiene.sh
      - name: ESLint
        run: bun run lint
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Unit + integration tests
        run: bun run test
      - name: Security audit
        run: bash scripts/security-audit.sh
      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./test.db"
