name: Scheduled wallet escrow release

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-wallet-escrow-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call protected wallet release endpoint
        env:
          CRON_URL: ${{ secrets.MEKANIX_CRON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CRON_URL}" || -z "${CRON_SECRET}" ]]; then
            echo "MEKANIX_CRON_URL and CRON_SECRET are not configured; scheduled release is intentionally inactive."
            exit 0
          fi
          if [[ "${CRON_SECRET}" == *$'\n'* || "${CRON_SECRET}" == *$'\r'* ]]; then
            echo "CRON_SECRET contains invalid line breaks."
            exit 1
          fi
          curl --fail --silent --show-error \
            --retry 2 --retry-all-errors --max-time 60 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Content-Type: application/json" \
            "${CRON_URL%/}/api/internal/wallet-release"
