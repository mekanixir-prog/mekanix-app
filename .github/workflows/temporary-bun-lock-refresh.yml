name: Temporary Bun lockfile refresh

on:
  pull_request:
    branches:
      - fix/staging-compose-and-redis-auth-2026-11-14

permissions:
  contents: write

concurrency:
  group: bun-lock-refresh-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Regenerate bun.lock from the pinned runtime
        run: bun install

      - name: Commit the regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bun.lock
          if git diff --cached --quiet; then
            echo "No bun.lock changes were required."
          else
            git commit -m "chore(deps): refresh Bun lockfile for security patches"
            git push origin "HEAD:refs/heads/${GITHUB_HEAD_REF}"
          fi

      - name: Verify dependency audit
        run: bun audit --audit-level=moderate
