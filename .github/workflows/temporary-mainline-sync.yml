name: Temporary mainline sync

on:
  push:
    branches:
      - fix/financial-release-candidate-2026-11-14

permissions:
  contents: write

concurrency:
  group: temporary-mainline-sync-financial-candidate
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - name: Merge current main into candidate branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff -X ours --no-edit origin/main
          git push origin "HEAD:refs/heads/${GITHUB_REF_NAME}"
