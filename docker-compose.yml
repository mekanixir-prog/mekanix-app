# MEKANIX — Production Docker Compose
#
# Fail-closed deployment contract:
# - PostgreSQL and Redis are not exposed to the host.
# - Database, Redis, user JWT, admin JWT and OTP hash secrets are required.
# - Redis requires password authentication and a healthy authenticated ping.
# - The app binds to 127.0.0.1; use Caddy/nginx as the public HTTPS reverse proxy.
# - Migrations run as a separate one-shot service before the app starts.
# - /api/ready remains the final production release gate.

services:
  migrate:
    build:
      context: .
      target: migrator
    environment:
      - DATABASE_URL=postgresql://mekanix:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/mekanix
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - DATABASE_URL=postgresql://mekanix:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/mekanix
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required}
      - OTP_HASH_SECRET=${OTP_HASH_SECRET:?OTP_HASH_SECRET is required}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-}
      - ADMIN_BOOTSTRAP_USERNAME=${ADMIN_BOOTSTRAP_USERNAME:-admin}
      - ADMIN_BOOTSTRAP_EMAIL=${ADMIN_BOOTSTRAP_EMAIL:-admin@mekanix.ir}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      - MEKANIX_PRICING_IRR_APPROVED=${MEKANIX_PRICING_IRR_APPROVED:-false}
      - MEKANIX_TECHNICIAN_FEES_IRR_VERIFIED=${MEKANIX_TECHNICIAN_FEES_IRR_VERIFIED:-false}
      - MEKANIX_JOB_PART_IRR_PROVENANCE_VERIFIED=${MEKANIX_JOB_PART_IRR_PROVENANCE_VERIFIED:-false}
      - MEKANIX_WITHDRAWAL_IRR_POLICY_APPROVED=${MEKANIX_WITHDRAWAL_IRR_POLICY_APPROVED:-false}
      - MEKANIX_WITHDRAWAL_MIN_IRR=${MEKANIX_WITHDRAWAL_MIN_IRR:-0}
      - MEKANIX_WITHDRAWAL_MAX_IRR=${MEKANIX_WITHDRAWAL_MAX_IRR:-0}
      - MEKANIX_WITHDRAWAL_IRR_PROVENANCE_VERIFIED=${MEKANIX_WITHDRAWAL_IRR_PROVENANCE_VERIFIED:-false}
      - WALLET_RELEASE_SCHEDULED=${WALLET_RELEASE_SCHEDULED:-false}
      - MEKANIX_ALLOW_PREVIEW_EMBEDDING=${MEKANIX_ALLOW_PREVIEW_EMBEDDING:-false}
      - SMS_PROVIDER=${SMS_PROVIDER:-console}
      - KAVENEGAR_API_KEY=${KAVENEGAR_API_KEY:-}
      - KAVENEGAR_TEMPLATE=${KAVENEGAR_TEMPLATE:-}
      - MELIPAYAMAK_USERNAME=${MELIPAYAMAK_USERNAME:-}
      - MELIPAYAMAK_PASSWORD=${MELIPAYAMAK_PASSWORD:-}
      - MELIPAYAMAK_SENDER=${MELIPAYAMAK_SENDER:-}
      - FARAPAYAMAK_USERNAME=${FARAPAYAMAK_USERNAME:-}
      - FARAPAYAMAK_PASSWORD=${FARAPAYAMAK_PASSWORD:-}
      - FARAPAYAMAK_SENDER=${FARAPAYAMAK_SENDER:-}
      - PAYMENT_PROVIDER=${PAYMENT_PROVIDER:-simulator}
      - ZARINPAL_MERCHANT_ID=${ZARINPAL_MERCHANT_ID:-}
      - IDPAY_API_KEY=${IDPAY_API_KEY:-}
      - NESHAN_API_KEY=${NESHAN_API_KEY:-}
      - GOOGLE_MAPS_API_KEY=${GOOGLE_MAPS_API_KEY:-}
      - OSRM_API_URL=${OSRM_API_URL:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=mekanix
      - POSTGRES_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - POSTGRES_DB=mekanix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mekanix -d mekanix"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
