<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>مکانیکس — آفلاین</title>
  <style>
    body {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #050607;
      color: #fff;
      font-family: system-ui, sans-serif;
      text-align: center;
    }
    .container { padding: 2rem; }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { color: rgba(255,255,255,0.6); font-size: 0.875rem; }
    .icon {
      width: 64px; height: 64px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, #F5A524, #F97316);
      border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>اتصال اینترنت برقرار نیست</h1>
    <p>لطفاً اتصال خود را بررسی و دوباره تلاش کنید.</p>
  </div>
</body>
</html>
