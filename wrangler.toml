# MEKANIX — Cloudflare Pages Configuration
# D1 database ID: f8dbaaf3-4c6b-40d5-9dce-ecaa839780e2

name = "mekanix"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Pages build output directory (OpenNext outputs to .open-next)
pages_build_output_dir = ".open-next"

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "mekanix"
database_id = "f8dbaaf3-4c6b-40d5-9dce-ecaa839780e2"

# Environment variables (non-secret)
[vars]
SMS_PROVIDER = "console"
PAYMENT_PROVIDER = "simulator"

# Observability
[observability]
enabled = true
